name: Actualizador Diario de EPG

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a las 00:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install requests
          pip install google-generativeai

      - name: Ejecutar Script de Filtro con IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python filter_epg.py

      - name: Subir cambios a GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Añadimos descripciones_ia.json para guardar la base de datos de la IA
          git add guia_personalizada.xml guia_personalizada.xml.gz "errores canales.txt" descripciones_ia.json
          git commit -m "Actualización automática de EPG, informe de errores y memoria IA" || exit 0
          git push
