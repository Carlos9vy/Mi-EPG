name: Actualizador Diario de EPG

on:
  schedule:
    - cron: '0 10 * * *' # Se ejecuta todos los días a las 10:00 UTC (5:00 a.m. en Ecuador)
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web

# Control de concurrencia: Evita colas atascadas cancelando ejecuciones anteriores si se lanza una nueva
concurrency:
  group: update-epg-actions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Script de Filtro
        run: python filter_epg.py

      - name: Subir cambios a GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add guia_personalizada.xml guia_personalizada.xml.gz "errores canales.txt"
          git commit -m "Actualización automática de EPG e informe de errores" || exit 0
          git push
