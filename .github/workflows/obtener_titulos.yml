name: Extractor de Titulos y Generador IA

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 03:00 UTC
    - cron: '0 3 */3 * *'
  workflow_dispatch: # Activa el botón manual en la web de GitHub

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests google-genai

      - name: Ejecutar Extractor de Títulos
        run: python get_titles.py

      - name: Generar Descripciones con IA y Limpiar Historial
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generar_descripciones.py

      - name: Guardar los archivos JSON en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add borrador_titulos.json descripciones_ia.json
          git commit -m "Borrador de títulos y descripciones IA actualizadas" || exit 0
          git push
